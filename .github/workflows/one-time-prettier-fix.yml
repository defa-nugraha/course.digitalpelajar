name: one-time-prettier-fix
on:
  push:
    branches:
      - main
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write resources/js/components/service-transition-dialog.tsx resources/js/pages/admin/quiz-editor.tsx resources/js/pages/student/learning.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-frontend
          path: |
            resources/js/components/service-transition-dialog.tsx
            resources/js/pages/admin/quiz-editor.tsx
            resources/js/pages/student/learning.tsx
