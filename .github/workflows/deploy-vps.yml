name: test-and-unit-test

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-and-unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Lint & Static Checks)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: PHP syntax check
        run: |
          set -e
          find app config database routes tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: PHP code style check
        run: vendor/bin/pint --test

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npm run format:check

  unit-test:
    name: Unit Test (Feature Scenarios)
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run Unit tests per file
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -e
          find tests/Unit -type f -name '*Test.php' -print0 |
            while IFS= read -r -d '' test_file; do
              echo "::group::Unit test: ${test_file}"
              php artisan test "${test_file}"
              echo "::endgroup::"
            done

      - name: Run Feature tests per feature
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -e
          find tests/Feature -type f -name '*Test.php' -print0 |
            while IFS= read -r -d '' test_file; do
              echo "::group::Feature test: ${test_file}"
              php artisan test "${test_file}"
              echo "::endgroup::"
            done
