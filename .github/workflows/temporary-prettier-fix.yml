name: temporary-prettier-fix
on:
  push:
    branches:
      - feat/dedicated-quiz-workflow
    paths:
      - 'resources/js/pages/student/learning.tsx'
      - 'resources/js/pages/student/quiz-attempt.tsx'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dedicated-quiz-workflow
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write resources/js/pages/student/learning.tsx resources/js/pages/student/quiz-attempt.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/student/learning.tsx resources/js/pages/student/quiz-attempt.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: format quiz learning pages"
          git pull --rebase origin feat/dedicated-quiz-workflow
          git push origin HEAD:feat/dedicated-quiz-workflow
